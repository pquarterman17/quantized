name: E2E (Playwright)

# GUI_INTERACTION_PLAN.md #15 — real-browser interaction coverage. A separate,
# independent workflow from CI (ci.yml): NOT wired into branch protection as a
# required check, so a flaky/slow browser run never blocks a merge. It exists
# so the suite gets exercised on main and every review-ready PR without being
# load-bearing. Drafts intentionally defer browser coverage until substantive
# author/reviewer edits are complete.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # Manual runs exist for the cross-browser job's full-suite probe (below).
  # On push/pull_request `inputs.xbrowser_full` is empty, so both jobs behave
  # exactly as on any other run.
  workflow_dispatch:
    inputs:
      xbrowser_full:
        description: "Cross-browser job: run EVERY spec on Firefox + WebKit, not just the dialog/modality/keyboard set"
        type: boolean
        default: false

# Only PR runs share a group (a newer push supersedes the older run). Every
# other run is keyed by its commit, so back-to-back merges to main never
# cancel each other or a pending run: each main commit keeps a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Sync backend deps (webServer runs `uv run qz`)
        working-directory: .
        run: uv sync --group dev
      - uses: actions/setup-node@v7
        with:
          # Repo root .nvmrc is the single Node-version source of truth
          # (ROBUSTNESS_PLAN #2).
          node-version-file: .nvmrc
      - name: Install frontend deps
        # npm ci, not npm install — see ci.yml; the floating install here is
        # exactly what let CI's Playwright drift off the lockfile.
        run: npm ci
      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium
      - name: Build the SPA (what the backend serves)
        run: npm run build
      - name: Run the interaction-journey suite
        run: npm run e2e
        continue-on-error: false
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7

  # The Playwright version pinned in package-lock.json, so the cross-browser
  # job's container image is chosen by the lockfile instead of a hand-edited
  # tag. A Playwright bump (Dependabot or manual) moves both together.
  playwright-version:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.lock.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: frontend/package-lock.json
          sparse-checkout-cone-mode: false
      - id: lock
        run: |
          version=$(jq -r '.packages["node_modules/@playwright/test"].version' frontend/package-lock.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::No @playwright/test version in frontend/package-lock.json (got '$version')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Cross-browser coverage (PRIMARY_SOFTWARE_AUDIT_PLAN R12 / R16): the
  # background `inert` modality in src/lib/modalInert.ts, and the Escape /
  # focus / Tab behaviour around it, had been measured in Chromium only. The
  # desktop app runs in pywebview, which is WKWebView (WebKit) on macOS, and
  # the SPA is also opened in any browser. This job runs the engine-sensitive
  # journeys on Firefox and WebKit: e2e/playwright.config.ts's XBROWSER_SPECS
  # (modal-inert, workshop-escape-ladder, region-tool-escape,
  # quick-figure-builder, library-tiles, details-keyboard, keyboard-only; 16
  # tests per engine). A manual run with `xbrowser_full` runs every spec.
  #
  # A SEPARATE job from `e2e` above, which is left byte-for-byte as it was
  # (Chromium only, no QZ_E2E_XBROWSER, so its project list is unchanged).
  # Like the rest of this workflow it is NOT a required check. Before adding
  # its two contexts to branch protection, give it a run history: Linux
  # WebKit is WebKitGTK-family, not the macOS WKWebView the desktop ships, so
  # a red leg here needs reading, not an automatic merge block.
  e2e-xbrowser:
    name: e2e cross-browser (${{ matrix.engine }})
    needs: playwright-version
    runs-on: ubuntu-latest
    # Microsoft's Playwright image already holds every engine and its system
    # libraries. `playwright install --with-deps` on the bare runner fetched
    # ~185 apt packages per run, and a slow Ubuntu mirror ran that step past
    # its 30-minute limit three times on 2026-11-05/06 (PRs #620 and #616)
    # before any test started. The tag comes from the lockfile (job above),
    # so the image's browsers always match the installed @playwright/test.
    #
    # `--user 1001` runs as the hosted runner's own user, the setup
    # Playwright documents for this image. As root, Firefox refuses to start
    # under the HOME Actions provides (/github/home, owned by 1001).
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --user 1001
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    defaults:
      run:
        working-directory: frontend
    env:
      QZ_E2E_XBROWSER: "1"
      QZ_E2E_XBROWSER_FULL: ${{ inputs.xbrowser_full && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync backend deps (webServer runs `uv run qz`)
        working-directory: .
        run: uv sync --group dev
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Build the SPA (what the backend serves)
        run: npm run build
      - name: Run the cross-browser journeys (${{ matrix.engine }})
        run: npx playwright test --config=e2e/playwright.config.ts --project=${{ matrix.engine }}
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.engine }}
          path: frontend/test-results
          retention-days: 7
