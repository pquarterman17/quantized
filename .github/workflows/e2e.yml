name: E2E (Playwright)

# GUI_INTERACTION_PLAN.md #15 — real-browser interaction coverage. A separate,
# independent workflow from CI (ci.yml): NOT wired into branch protection as a
# required check, so a flaky/slow browser run never blocks a merge. It exists
# so the suite gets exercised on main and every review-ready PR without being
# load-bearing. Drafts intentionally defer browser coverage until substantive
# author/reviewer edits are complete.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # Manual runs exist for the cross-browser job's full-suite probe (below).
  # On push/pull_request `inputs.xbrowser_full` is empty, so both jobs behave
  # exactly as on any other run.
  workflow_dispatch:
    inputs:
      xbrowser_full:
        description: "Cross-browser job: run EVERY spec on Firefox + WebKit, not just the dialog/modality/keyboard set"
        type: boolean
        default: false

# Only PR runs share a group (a newer push supersedes the older run). Every
# other run is keyed by its commit, so back-to-back merges to main never
# cancel each other or a pending run: each main commit keeps a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    needs: playwright-version
    runs-on: ubuntu-latest
    # The same Playwright image, user and fallback as e2e-xbrowser (see the
    # notes there). The bare-runner `install --with-deps chromium` this
    # replaces spent 11 minutes on the apt mirror on 2026-11-06.
    container:
      image: mcr.microsoft.com/playwright:${{ needs.playwright-version.outputs.tag }}
      options: ${{ needs.playwright-version.outputs.exact == 'true' && '--user 1001' || '--user 0' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          # The firefox leg of e2e-xbrowser saves this key; jobs sharing it
          # only restore, so they never race to reserve the same cache.
          save-cache: false
      - name: Sync backend deps (webServer runs `uv run qz`)
        working-directory: .
        run: uv sync --group dev
      - uses: actions/setup-node@v7
        with:
          # Repo root .nvmrc is the single Node-version source of truth
          # (ROBUSTNESS_PLAN #2).
          node-version-file: .nvmrc
      - name: Install frontend deps
        # npm ci, not npm install — see ci.yml; the floating install here is
        # exactly what let CI's Playwright drift off the lockfile.
        run: npm ci
      - name: Install the locked chromium (image predates the lockfile)
        # As in e2e-xbrowser: only on the fallback, and apt only if the
        # browser cannot launch without it.
        if: needs.playwright-version.outputs.exact != 'true'
        timeout-minutes: 15
        run: |
          npx playwright install chromium
          if ! node -e "require('@playwright/test').chromium.launch().then((b) => b.close())"; then
            npx playwright install-deps chromium
          fi
      - name: Build the SPA (what the backend serves)
        run: npm run build
      - name: Run the interaction-journey suite
        run: npm run e2e
        continue-on-error: false
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7

  # Picks the cross-browser job's container image from the Playwright version
  # pinned in package-lock.json, so a Playwright bump (Dependabot or manual)
  # moves the image with it and no tag is hand-edited. The bare `vX.Y.Z` tag
  # follows whatever Ubuntu base Microsoft currently ships, so a base switch
  # (noble -> resolute) needs no edit either.
  #
  # A lockfile bump can land before Microsoft publishes the matching image
  # (the registry answers 404 for the tag). Then this picks the newest
  # published version below the locked one, and e2e-xbrowser installs the
  # locked browser on top of it. Any other registry answer (an outage) keeps
  # the exact tag, as the pull would hit the same registry.
  playwright-version:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.lock.outputs.tag }}
      exact: ${{ steps.lock.outputs.exact }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: frontend/package-lock.json
          sparse-checkout-cone-mode: false
      - id: lock
        run: |
          version=$(jq -r '.packages["node_modules/@playwright/test"].version' frontend/package-lock.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::No @playwright/test version in frontend/package-lock.json (got '$version')"
            exit 1
          fi
          registry=https://mcr.microsoft.com/v2/playwright
          tag="v$version"
          exact=true
          status=$(curl -sS -o /dev/null -w '%{http_code}' -I --retry 3 \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "$registry/manifests/$tag") || true
          if [ "$status" = 404 ]; then
            older=$({ curl -fsSL --retry 3 "$registry/tags/list" | jq -r '.tags[]' | grep -xE 'v[0-9]+\.[0-9]+\.[0-9]+'; echo "$tag"; } \
              | sort -uV | grep -x -B1 -- "$tag" | sed -n 1p) || older=""
            if [ -n "$older" ] && [ "$older" != "$tag" ]; then
              echo "::warning::No Playwright image for $version yet; using $older and installing the $version browser in the job."
              tag=$older
              exact=false
            else
              echo "::warning::No Playwright image for $version and no older one listed; using $tag."
            fi
          elif [ "$status" != 200 ]; then
            echo "::warning::Registry answered '$status' for $tag; using it as is."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "exact=$exact" >> "$GITHUB_OUTPUT"

  # Cross-browser coverage (PRIMARY_SOFTWARE_AUDIT_PLAN R12 / R16): the
  # background `inert` modality in src/lib/modalInert.ts, and the Escape /
  # focus / Tab behaviour around it, had been measured in Chromium only. The
  # desktop app runs in pywebview, which is WKWebView (WebKit) on macOS, and
  # the SPA is also opened in any browser. This job runs the engine-sensitive
  # journeys on Firefox and WebKit: e2e/playwright.config.ts's XBROWSER_SPECS
  # (modal-inert, workshop-escape-ladder, region-tool-escape,
  # quick-figure-builder, library-tiles, details-keyboard, keyboard-only). A
  # manual run with `xbrowser_full` runs every spec.
  #
  # A SEPARATE job from `e2e` above, which stays Chromium only with no
  # QZ_E2E_XBROWSER, so its project list is unchanged.
  # Like the rest of this workflow it is NOT a required check. Before adding
  # its two contexts to branch protection, give it a run history: Linux
  # WebKit is WebKitGTK-family, not the macOS WKWebView the desktop ships, so
  # a red leg here needs reading, not an automatic merge block.
  e2e-xbrowser:
    name: e2e cross-browser (${{ matrix.engine }})
    needs: playwright-version
    runs-on: ubuntu-latest
    # Microsoft's Playwright image already holds every engine and its system
    # libraries. `playwright install --with-deps` on the bare runner fetched
    # ~185 apt packages per run, and a slow Ubuntu mirror ran that step past
    # its 30-minute limit three times on 2026-11-05/06 (PRs #620 and #616)
    # before any test started. The tag comes from the lockfile (job above),
    # so the image's browsers match the installed @playwright/test.
    #
    # `--user 1001` runs as the hosted runner's own user, the setup
    # Playwright documents for this image. As root, Firefox refuses to start
    # under the HOME Actions provides (/github/home, owned by 1001). Only the
    # fallback (an image older than the lockfile) runs as root, because it may
    # need to install system libraries the newer browser wants; the test step
    # then points HOME at /root inside its own script, never through `env:`,
    # which the runner would also hand to its docker CLI.
    container:
      image: mcr.microsoft.com/playwright:${{ needs.playwright-version.outputs.tag }}
      options: ${{ needs.playwright-version.outputs.exact == 'true' && '--user 1001' || '--user 0' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    defaults:
      run:
        working-directory: frontend
    env:
      QZ_E2E_XBROWSER: "1"
      QZ_E2E_XBROWSER_FULL: ${{ inputs.xbrowser_full && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          # One leg saves; two saving the same key at once warn "Unable to
          # reserve cache".
          save-cache: ${{ matrix.engine == 'firefox' }}
      - name: Sync backend deps (webServer runs `uv run qz`)
        working-directory: .
        run: uv sync --group dev
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Install the locked ${{ matrix.engine }} (image predates the lockfile)
        # Only when playwright-version fell back to an older image. The
        # browser goes into the image's /ms-playwright (root, see above).
        # System libraries are installed only if the browser cannot launch
        # without them, so the usual case never touches the apt mirror.
        if: needs.playwright-version.outputs.exact != 'true'
        timeout-minutes: 15
        run: |
          npx playwright install ${{ matrix.engine }}
          if ! HOME=/root node -e "require('@playwright/test')['${{ matrix.engine }}'].launch().then((b) => b.close())"; then
            npx playwright install-deps ${{ matrix.engine }}
          fi
      - name: Build the SPA (what the backend serves)
        run: npm run build
      - name: Run the cross-browser journeys (${{ matrix.engine }})
        run: |
          if [ "$(id -u)" = 0 ]; then export HOME=/root; fi  # fallback only, see the container note
          npx playwright test --config=e2e/playwright.config.ts --project=${{ matrix.engine }}
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.engine }}
          path: frontend/test-results
          retention-days: 7
