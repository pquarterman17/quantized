name: CodeQL

# Advanced setup (committed workflow) — equivalent to GitHub's managed default
# setup, but works without the security_events token scope. Scans the Python
# backend, the JS/TS frontend, and the Actions workflows themselves.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1" # weekly, Monday 03:27 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Default query suite (matches fermiviewer's query_suite: default),
          # minus the two queries excluded in the config below. The config
          # carries the rationale; SECURITY.md carries the register of sites,
          # and tests/test_repo_integrity.py fails the build if either drifts.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
