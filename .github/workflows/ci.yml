name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only checks out and tests — it never writes to the repo.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.11 = supported floor (requires-python), 3.13 = latest.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Sync deps
        run: uv sync --group dev
      # Lint + type-check once, on the latest interpreter (OS/version-independent).
      - name: Lint
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: uv run ruff check src tests
      - name: Type check
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: uv run mypy src
      # Golden fixtures + frozen JSON are committed, so the suite runs without MATLAB.
      - name: Tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install
        # npm ci, not npm install: install exactly the lockfile. `npm install`
        # resolves ^ranges to whatever is newest, so CI silently tested
        # different dependency versions than any local checkout (this hid a
        # real Playwright 1.61-vs-1.62 e2e regression on 2026-07-25).
        run: npm ci
      - name: Lint (eslint flat config; errors fail, warnings don't)
        run: npm run lint
      - name: Unit tests (vitest)
        # PR #94 (runs 30497138054/30498716041/30499733804): a long-lived node
        # process OOM'd at the DEFAULT ~4 GB heap limit minutes after all
        # 5,043 tests passed, failing the job on the unhandled worker-exit
        # alone. poolOptions.forks.execArgv provably reaches test forks (heap
        # probe) but NOT whichever process died, so set the heap ceiling as an
        # environment variable — NODE_OPTIONS is inherited by EVERY node
        # process in the tree (coordinator and workers). Pairs with the
        # CI-only maxForks cap in vite.config.ts to bound total RSS.
        run: npm test
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Build (includes typecheck)
        run: npm run build
