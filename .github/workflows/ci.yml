name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only checks out and tests — it never writes to the repo.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.11 = supported floor (requires-python), 3.13 = latest.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync deps
        run: uv sync --group dev
      # Lint + type-check once, on the latest interpreter (OS/version-independent).
      - name: Lint
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: uv run ruff check src tests tools
      - name: Type check
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: uv run mypy src
      # Golden fixtures + frozen JSON are committed, so the suite runs without MATLAB.
      # -n auto (pytest-xdist): parallelizes across the runner's cores.
      - name: Tests
        run: uv run pytest -q -n auto

  # POST_SPRINT_INDEPENDENT_REVIEW.md R7: bounded performance-regression
  # protection for the large-2-D-map import+regrid path. `tests/test_perf_
  # map_guard.py`'s `perfguard`-marked tests already run inside the required
  # `backend` job's plain `pytest -q` above (same pattern the pre-existing
  # `perf` marker uses -- generously bounded tripwires are cheap enough and
  # unlikely enough to trip that they stay in the blocking gate too). This
  # job exists ONLY for the "recorded trend data" half of R7's ask: a
  # `continue-on-error: true` job, deliberately NOT added to branch
  # protection's required-checks set, that runs the guard in isolation and
  # uploads its timing output as a downloadable artifact on every run so a
  # slow drift shows up in the run history even before it's large enough to
  # trip the (deliberately generous, ~10x-measured) wall-clock ceiling.
  perf-guard:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync deps
        run: uv sync --group dev
      - name: Run R7 large-map perf guard (non-blocking)
        # pipefail so a real pytest failure still shows red on this step
        # (distinct from `continue-on-error: true` above, which is what
        # actually keeps that red from blocking the merge) rather than
        # being masked by `tee`'s own always-zero exit code.
        run: |
          set -o pipefail
          uv run pytest -m perfguard -q -vv --durations=0 | tee perf-guard-timing.txt
      - name: Upload timing artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-guard-timing
          path: perf-guard-timing.txt
          retention-days: 90

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Repo root .nvmrc is the single Node-version source of truth
          # (ROBUSTNESS_PLAN #2) -- resolved relative to the repo root
          # regardless of this job's `working-directory: frontend` default.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        # npm ci, not npm install: install exactly the lockfile. `npm install`
        # resolves ^ranges to whatever is newest, so CI silently tested
        # different dependency versions than any local checkout (this hid a
        # real Playwright 1.61-vs-1.62 e2e regression on 2026-07-25).
        run: npm ci
      # Freshness guard for the generated API-types foundation: schema.d.ts is
      # committed (not built on the fly) so a stale generation can't silently
      # ship. If this fails, regenerate locally and commit the diff:
      #   uv run python tools/dump_openapi.py && cd frontend && npm run api:types
      - name: Generated API types are up to date
        run: |
          npm run api:types
          git diff --exit-code -- src/lib/api/schema.d.ts
      # R9 (POST_SPRINT_INDEPENDENT_REVIEW): `lint` runs `eslint --max-warnings=0
      # src` (package.json), so a react-hooks/exhaustive-deps (or any other)
      # warning fails CI same as an error — no warning can go unnoticed again.
      - name: Lint (eslint flat config; errors AND warnings fail via --max-warnings=0)
        run: npm run lint
      - name: Unit tests (vitest)
        run: npm test
      - name: Build (includes typecheck)
        run: npm run build

  # ROBUSTNESS_PLAN #1: on 2026-07-29 a clean checkout failed 176 frontend
  # tests across 22 files under Node 26 while this workflow stayed green the
  # whole time, because `frontend` above only ever runs the one pinned Node
  # version. This job re-runs the same steps against the latest Node release
  # so a future runtime-version break is visible on every PR instead of only
  # on a fresh checkout. Deliberately a SEPARATE job (not folded into
  # `frontend` above) and deliberately NOT added to required status checks:
  # renaming/matrixing `frontend` would change its check-context name and
  # silently desync branch protection's required-checks list (which pins the
  # literal string "frontend"); a second job with a new name has no such
  # effect. Not required for the same reason `e2e.yml` and the backend
  # matrix's macos-latest legs aren't: bleeding-edge Node can lag upstream
  # native-binary availability (e.g. the `canvas` optional dependency) for
  # reasons that have nothing to do with this repo's code, so a red X here
  # should be investigated, not treated as an automatic merge blocker.
  #
  # Node breadth only, not OS breadth: the 2026-07-29 failure was a Node
  # runtime issue (a `localStorage` global Node 20+ ships), not OS-specific,
  # so widening the OS axis too would add CI cost without covering a failure
  # class this repo has actually seen.
  #
  # Lint and build are NOT repeated here (cut 2026-09-03 as a CI wall-clock
  # trim): both are already covered by the `frontend` job above on the
  # pinned Node version, and neither is Node-version-sensitive the way the
  # 2026-07-29 vitest break was (a runtime global vitest picked up). Only
  # the unit-test run — the actual Node-version-sensitive check this job
  # exists for — is repeated against the latest Node release.
  frontend-node-current:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: current
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests (vitest)
        run: npm test
