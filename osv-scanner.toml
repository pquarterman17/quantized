# Unmaintained-crate notices deeper in Tauri's tree — build-time or
# pattern-matching helpers, no known vulnerability, no fix released.
#
# 2026-09-08: traced each to the dependency that actually pins it, so a future
# re-evaluation does not have to re-derive it.
#   - proc-macro-error is reached ONLY through glib-macros and gtk3-macros, so
#     it clears with the same gtk-rs 0.20 move as the block above — it is not a
#     separate piece of work.
#   - every unic-* crate below is reached ONLY through urlpattern 0.3.0, which
#     is pinned by tauri-utils; the newest tauri-utils (2.9.3, the version
#     locked here) still declares `urlpattern = "^0.3"`, and urlpattern dropped
#     the unic-* dependencies after 0.3. So these five are blocked on a
#     tauri-utils release that widens that requirement, NOT on anything this
#     repo controls — `cargo update` cannot clear them.
[[IgnoredVulns]]
