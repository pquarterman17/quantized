# Triaged-advisory register for the weekly vuln sweep
# (.github/workflows/vuln-sweep.yml, ROBUSTNESS #6).
#
# Every entry is a dated, deliberate decision. A red sweep run means a NEW
# advisory appeared that no entry covers — triage it (fix / book a plan row /
# add an entry here with a dated rationale), never leave the sweep red.
# All current entries clear automatically when Tauri's Linux stack moves off
# the gtk3 / glib 0.18 line (gtk-rs 0.20+): the ordinary lockfile bump drops
# the affected crates.

# glib unsoundness (VariantStrIter Iterator/DoubleEndedIterator impls).
# Mirrors the 2026-07-25 Dependabot dismissal as tolerable_risk: patched in
# glib 0.20.0 but the chain is glib 0.18.5 <- gtk 0.18.2 <- tauri 2 (current
# latest; its Linux backend has not moved to glib 0.20). Linux-only (.deb
# artifact), never called directly by quantized. Alias GHSA-wrw7-89jp-8q8g.
# Re-evaluated 2026-09-02 after GitHub reopened Dependabot alert #1 with no
# lockfile change: tauri 2.11.5 is still the newest release and still pins
# gtk 0.18; `cargo update -p glib --dry-run` locks 0 packages. Unchanged.
# Re-verified 2026-09-08 (alert #1 still open, still surfacing on every push):
# crates.io's newest stable tauri is STILL 2.11.5, the version locked here, so
# no release exists that could move this chain. Unchanged again.
[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
reason = "2026-08-01 (re-checked 2026-09-02 and 2026-09-08, unchanged): mirrors the dated Dependabot dismissal — unreachable gtk3-stack unsoundness, no compatible fix while Tauri v2 pins gtk-rs 0.18; re-eval when Tauri adopts gtk-rs 0.20"

# gtk3-rs bindings are unmaintained upstream (announced 2024) — advisory
