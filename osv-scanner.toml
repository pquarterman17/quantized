# Triaged-advisory register for the weekly vuln sweep
# (.github/workflows/vuln-sweep.yml, ROBUSTNESS #6).
#
# Every entry is a dated, deliberate decision. A red sweep run means a NEW
# advisory appeared that no entry covers — triage it (fix / book a plan row /
# add an entry here with a dated rationale), never leave the sweep red.
# The entries clear on TWO INDEPENDENT upstream conditions:
#
#   1. RUSTSEC-2024-0429 (glib) and RUSTSEC-2024-0370 (proc-macro-error, which
#      is reached only via glib-macros/gtk3-macros) clear when Tauri's Linux
#      stack moves off the gtk3 / glib 0.18 line (gtk-rs 0.20+): the ordinary
#      lockfile bump drops the affected crates.
#   2. GHSA-g3hv-75wg-m249 (minimatch, frontend dev tooling) clears when the
#      eslint chain and openapi-typescript move to minimatch 11; its
#      ignoreUntil re-raises it for triage regardless.
#
# 2026-10-31: removed 15 entries the sweep had been reporting as unused.
#   - The ten gtk3-rs "unmaintained" notices (RUSTSEC-2024-0411 through -0420)
#     were withdrawn by RustSec on 2026-08-14; the crates themselves are still
#     locked at 0.18.2.
#   - The five unic-* notices (RUSTSEC-2025-0075, -0080, -0081, -0098, -0100)
#     no longer apply: tauri-utils 2.10.1 locks urlpattern 0.6.0, which has no
#     unic-* dependencies, so those crates left the lock.

# glib unsoundness (VariantStrIter Iterator/DoubleEndedIterator impls).
# Mirrors the 2026-07-25 Dependabot dismissal as tolerable_risk: patched in
# glib 0.20.0 but the chain is glib 0.18.5 <- gtk 0.18.2 <- tauri 2 (current
# latest; its Linux backend has not moved to glib 0.20). Linux-only (.deb
# artifact), never called directly by quantized. Alias GHSA-wrw7-89jp-8q8g.
# Re-evaluated 2026-09-02 after GitHub reopened Dependabot alert #1 with no
# lockfile change: tauri 2.11.5 is still the newest release and still pins
# gtk 0.18; `cargo update -p glib --dry-run` locks 0 packages. Unchanged.
# Re-verified 2026-09-08 (alert #1 still open, still surfacing on every push):
# crates.io's newest stable tauri is STILL 2.11.5, the version locked here, so
# no release exists that could move this chain. Unchanged again.
[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
reason = "2026-08-01 (re-checked 2026-09-02 and 2026-09-08, unchanged): mirrors the dated Dependabot dismissal — unreachable gtk3-stack unsoundness, no compatible fix while Tauri v2 pins gtk-rs 0.18; re-eval when Tauri adopts gtk-rs 0.20"

# Unmaintained build-time proc-macro crate deeper in Tauri's tree, no known
# vulnerability, no fix released. 2026-09-08: traced to the dependency that
# actually pins it — proc-macro-error is reached ONLY through glib-macros and
# gtk3-macros, so it clears with the same gtk-rs 0.20 move as glib above; it
# is not a separate piece of work.
[[IgnoredVulns]]
id = "RUSTSEC-2024-0370"
reason = "2026-08-01 (re-checked 2026-09-08): proc-macro-error — unmaintained build-time proc-macro crate reached only via glib-macros/gtk3-macros; no vulnerability; clears with the gtk-rs 0.20 move"

# minimatch "globparts amplification" DoS (moderate; fixed only in 11.0.1, so
# every 10.x/5.x is affected). Two dev-only copies in frontend/package-lock.json:
#   - 10.2.5 via eslint, @eslint/config-array and @typescript-eslint/
#     typescript-estree, which all require ^10.2;
#   - 5.1.9 pinned exactly by @redocly/openapi-core 1.34.20 (via
#     openapi-typescript 7.13.0, used only by the manual `npm run api:types`).
# Neither ships in the SPA bundle, and both only ever match glob patterns this
# repo writes (eslint config/CLI paths, redocly lint config), never user input.
# Forcing minimatch 11 via npm overrides would break redocly's 5.x
# default-export call. ignoreUntil makes the sweep re-raise this for triage.
[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-01-31
reason = "2026-10-31: minimatch ReDoS-class DoS, fixed only in 11.0.1; dev-only copies (eslint chain ^10.2, redocly openapi-core pins 5.1.9) that match only repo-authored globs; no in-range fix. Re-check when eslint/typescript-eslint or openapi-typescript move to minimatch 11"
