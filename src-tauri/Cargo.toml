[package]
name = "quantized-shell"
version = "0.32.0"
description = "Quantized desktop shell (Tauri 2 window over the local FastAPI server)"
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# generate_context! expands to serde_json once tauri.conf.json carries a plugin
# config (the updater block), so these are required deps.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# auto-update: check GitHub Releases for a newer signed build, prompt via a
# native dialog, install + restart (driven from Rust — the frontend loads from
# a remote 127.0.0.1 URL, so JS-side Tauri APIs would need remote-IPC grants we
# deliberately avoid).
# Default features minus `zip`: that feature only unpacks Tauri-v1 `.zip` /
# `.tar.gz` updater bundles, and this app ships v2 artifacts (the signed NSIS
# `-setup.exe` itself, see release.yml), so it was dead code that pinned the
# vulnerable zip 4.x crate into the lock (RUSTSEC-2026-0367/0368/0369).
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-dialog = "2"
# the per-launch API token handed to the sidecar (docs/api_auth.md); the
# version already in the lock via tauri's own dependency tree
getrandom = "0.4"

[profile.release]
strip = true
lto = true
